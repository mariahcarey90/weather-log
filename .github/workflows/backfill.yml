name: Refresh forecast calibration

on:
  schedule:
    - cron: "50 2 * * 1"   # weekly, Monday 02:50 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backfill.py", ".github/workflows/backfill.yml"]

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Backfill
        run: python3 backfill.py
      - name: Commit
        run: |
          git config user.name "weather-log bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calibration.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "calibration: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
