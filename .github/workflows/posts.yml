name: Fetch post-count market data

on:
  schedule:
    # every 2 hours at :45 on odd UTC hours, after the weather fetch
    - cron: "45 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also rebuild the backtest file (price history of recent windows)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["markets/posts_fetch.py", ".github/workflows/posts.yml"]

permissions:
  contents: write

concurrency:
  group: posts
  cancel-in-progress: false

jobs:
  posts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Fetch
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.backfill }}" = "true" ]; then
            python3 markets/posts_fetch.py --backfill
          else
            python3 markets/posts_fetch.py
          fi
      - name: Commit data
        run: |
          git config user.name "weather-log bot"
          git config user.email "actions@users.noreply.github.com"
          git add markets/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "posts data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
