name: Discover new market tracks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["markets/discover.py", "markets/probe_xtracker.py", "markets/probe_music.py", ".github/workflows/discover.yml"]

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Discover
        run: python3 markets/discover.py || true
      - name: Probe music sources
        run: python3 markets/probe_music.py
      - name: Commit
        run: |
          git config user.name "weather-log bot"
          git config user.email "actions@users.noreply.github.com"
          git add markets/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "discovery: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            { git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null; false; }; } && git push origin HEAD:main && exit 0
            sleep $((5 + RANDOM % 10))
          done
          exit 1
