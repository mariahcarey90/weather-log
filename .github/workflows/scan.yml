name: Scan candidate cities (research)

on:
  push:
    branches: [scan-cities]
    paths: ["scan_cities.py", "scan_only.txt", ".github/workflows/scan.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Scan
        run: python3 scan_cities.py $(cat scan_only.txt 2>/dev/null)
      - name: Commit results to this branch only
        run: |
          git config user.name "weather-log bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${GITHUB_REF_NAME}
