name: Fetch weather and market data

on:
  schedule:
    # Every 2 hours at :35 on odd UTC hours, so fresh data lands ~30 min
    # before each Claude run (00:07, 06:07, 12:07, 18:07 UTC).
    - cron: "35 1-23/2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fetch.py", ".github/workflows/fetch.yml"]

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: python3 fetch.py
      - name: Commit data
        run: |
          git config user.name "weather-log bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
